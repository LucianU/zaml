[build-system]
requires = ["setuptools>=77", "ziglang==0.17.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zaml"
version = "0.1.0"
description = "Fast YAML 1.2 parsing library for Python, written in Zig"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/LucianU/zaml"
Issues = "https://github.com/LucianU/zaml/issues"
"Original project" = "https://github.com/adamserafini/zaml"

[dependency-groups]
dev = ["pytest", "pyyaml", "ruamel.yaml"]
bench = ["pyyaml", "ruamel.yaml", "yamlrocks", "yaml-rs", "py-yaml12", "ryaml"]

[tool.cibuildwheel]
# One stable-ABI (abi3) wheel per platform covers CPython 3.10+.
build = "cp310-*"
skip = "*-musllinux_*"
test-groups = ["dev"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
# Built on an Intel runner: zig cross-compiles the Apple Silicon wheel, whose
# tests cannot run there (it is tested on Apple Silicon machines instead).
archs = ["x86_64", "arm64"]
test-skip = "*-macosx_arm64"

[tool.cibuildwheel.windows]
# 64-bit only; 32-bit Windows Python is rare and untested here.
archs = ["AMD64"]

[tool.pyright]
venvPath = "."
venv = ".venv"
