name: CI
on:
  push:
  pull_request:
  workflow_dispatch:  # "Run workflow" button: also builds wheels
  release:
    types:
      - published

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub's hosted macOS runners regularly fail to pick up jobs, which
        # failed every push; macOS is tested locally and in the wheel builds.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Zig comes from the ziglang build requirement in pyproject.toml.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Test
        run: python -m pytest tests

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel builds both Mac wheels (see pyproject.toml); GitHub's
        # Apple Silicon runners are too often unavailable.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_password }}
